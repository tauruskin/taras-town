<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pushkar Ball</title>

  <!-- Fill the whole phone screen, including behind the notch, and stop the
       page from being pinch-zoomed or double-tap-zoomed while playing. A
       double-tap that zooms instead of jumping is indistinguishable from a
       broken game. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4FC3F7">

  <!-- The hero, inline so there is no extra file to load. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23E8402A'/></svg>">

  <!-- All paths are relative (no leading slash) so the game works from a
       GitHub Pages sub-folder such as /taras-town/. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- The game itself -->
  <canvas id="game"></canvas>

  <!--
    The opening screen.

    The tap that leaves it is also what lets a phone go full screen and make any
    sound at all, so there always has to be at least one tap before play begins.

    There is no writing on any button — the only text is the game's own name,
    exactly as Taras Town shows its own on its opening panel.
  -->
  <div id="start-screen">
    <div class="panel" id="panel-welcome">
      <!-- Back to the hub's picker screen — the same house shape shown on its
           tile there, so the two visually match up. -->
      <button id="hub-button" class="hub-link" aria-label="All games">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 24 L24 8 L42 24 L36 24 L36 40 L12 40 L12 24 Z"/>
        </svg>
      </button>

      <div class="ball"></div>
      <h1>Pushkar Ball</h1>

      <button id="start-button" class="big red" aria-label="Play">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M17 11 L37 24 L17 37 Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Shown automatically by CSS whenever the phone is held upright. -->
  <div id="rotate-screen">
    <div class="phone"></div>
    <p>&#8635;</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
