<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taras Town</title>

  <!-- Fill the whole phone screen, including behind the notch, and stop the
       page from being pinch-zoomed or double-tap-zoomed while playing. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Lets the game run without Safari's browser chrome when added to the
       home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7ED957">

  <!-- A little sun, inline so there is no extra file to load. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23FFD93D'/></svg>">

  <!-- What makes the game installable: a name, an icon, and how it should
       open (full screen, landscape). See manifest.json and js/pwa.js. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- All paths are relative (no leading slash) so the game works from a
       GitHub Pages sub-folder such as /taras-town/. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- The game itself -->
  <canvas id="game"></canvas>

  <!--
    The opening screen: four panels, one shown at a time.

    The tap that leaves the first panel is also what lets a phone go full
    screen and make any sound at all, so there always has to be at least one
    tap before play begins.

    There is no writing on any button. Taras may not read fluently, so every
    choice is a picture — and the only text anywhere is the room code, which
    is digits, the one kind of text he does reliably read.
  -->
  <div id="start-screen">

    <!-- 1. On your own, or together? -->
    <div class="panel" id="panel-welcome">
      <div class="sun"></div>
      <h1>Taras Town</h1>
      <div class="choices">
        <button id="start-button" class="big red" aria-label="Play on your own">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="16" r="7.5"/>
            <rect x="14" y="26" width="20" height="16" rx="8"/>
          </svg>
        </button>
        <button id="together-button" class="big blue" aria-label="Play together">
          <!-- Two figures OVERLAPPING, one behind the other. Side by side and
               evenly spaced they just read as four dots at this size. -->
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <g opacity="0.65">
              <circle cx="32" cy="15" r="6"/>
              <rect x="24" y="23" width="16" height="14" rx="7"/>
            </g>
            <circle cx="19" cy="19" r="7.5"/>
            <rect x="9" y="28" width="20" height="15" rx="8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 2. Start a new game, or join somebody else's? -->
    <div class="panel hidden" id="panel-together">
      <div class="choices">
        <button id="make-button" class="big green" aria-label="Start a new game">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="20" y="9" width="8" height="30" rx="4"/>
            <rect x="9" y="20" width="30" height="8" rx="4"/>
          </svg>
        </button>
        <button id="join-button" class="big blue" aria-label="Join a game">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8"  y="10" width="9" height="9" rx="2.5"/>
            <rect x="20" y="10" width="9" height="9" rx="2.5"/>
            <rect x="32" y="10" width="9" height="9" rx="2.5"/>
            <rect x="8"  y="22" width="9" height="9" rx="2.5"/>
            <rect x="20" y="22" width="9" height="9" rx="2.5"/>
            <rect x="32" y="22" width="9" height="9" rx="2.5"/>
            <rect x="20" y="34" width="9" height="9" rx="2.5"/>
          </svg>
        </button>
      </div>
      <button class="back" data-back="panel-name" aria-label="Go back">&#8617;</button>
    </div>

    <!--
      2b. What shall we call you?

      The one place in the game with a real keyboard. It uses the phone's own
      keyboard rather than a home-made A-Z pad, because a home-made one would
      have to pick an alphabet, and this family's names are not all spelled in
      the same one as the buttons.
    -->
    <div class="panel hidden" id="panel-name">
      <!-- A little figure, so the box is understood as "this is you" without
           a word of explanation. -->
      <svg class="who" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="15" r="8"/>
        <rect x="12" y="26" width="24" height="18" rx="9"/>
      </svg>

      <input id="name-input" type="text" maxlength="10" autocomplete="off"
             autocapitalize="words" autocorrect="off" spellcheck="false"
             enterkeyhint="go" aria-label="Your name">

      <button id="name-done-button" class="big red" aria-label="Done">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M17 11 L37 24 L17 37 Z"/>
        </svg>
      </button>
      <button class="back" data-back="panel-welcome" aria-label="Go back">&#8617;</button>
    </div>

    <!-- 3. Here is your code. Tell it to the other player. -->
    <div class="panel hidden" id="panel-code">
      <div class="code-row" id="room-code"></div>
      <button id="code-play-button" class="big red" aria-label="Start playing">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M17 11 L37 24 L17 37 Z"/>
        </svg>
      </button>
      <button class="back" data-back="panel-together" aria-label="Go back">&#8617;</button>
    </div>

    <!-- 4. Type the code you were told. -->
    <div class="panel hidden" id="panel-keypad">
      <div class="code-row" id="typed-code"></div>
      <div class="keys" id="keypad"></div>
      <button class="back" data-back="panel-together" aria-label="Go back">&#8617;</button>
    </div>
  </div>

  <!-- Shown automatically by CSS whenever the phone is held upright. -->
  <div id="rotate-screen">
    <div class="phone"></div>
    <p>&#8635;</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
