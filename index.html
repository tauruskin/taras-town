<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pushkar Games</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7ED957">

  <!-- Same little sun as the games inside, inline so there is no extra file
       to load. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23FFD93D'/></svg>">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- All paths are relative (no leading slash) so the hub works from a
       GitHub Pages sub-folder such as /taras-town/. -->
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>

  <!--
    The picker screen: one tile per game.

    Each tile is a picture FIRST and a name second, and that order is the whole
    design. Taras may not read fluently, so the picture and the colour are what
    he navigates by — they are what he recognises from across the room, and
    they are sized and placed so that nothing changes for him. The name
    underneath is for everybody else: an adult handing him the phone, and
    Taras himself in a year or two.

    That makes the tile names a deliberate, narrow exception to "almost no
    text", which is written down in CLAUDE.md so it is not mistaken for the
    rule slipping. The test of it is simple: cover the words and the screen
    must still be usable. It is.

    Each name stays INSIDE its own <a>, so the whole tile — picture and word
    together — is one tap target. Nothing here should ever be a word you have
    to hit precisely.
  -->
  <div id="hub-screen">
    <div class="sun"></div>
    <h1>Pushkar Games</h1>

    <div class="tiles">
      <a class="tile" href="games/taras-town/index.html" aria-label="Play Taras Town">
        <span class="art">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M6 24 L24 8 L42 24 L36 24 L36 40 L12 40 L12 24 Z"/>
          </svg>
        </span>
        <span class="name">Taras Town</span>
      </a>

      <!-- A ball, with two fading ghosts of itself behind it: a ball in
           motion. The first attempt drew the ball with a bounce arc beneath it
           and read, unmistakably, as a face — a dot with a mouth. Nothing but
           looking at it would have caught that. -->
      <a class="tile ball" href="games/pushkar-ball/index.html" aria-label="Play Pushkar Ball">
        <span class="art">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="8"  cy="10" r="4"   opacity="0.3"/>
            <circle cx="18" cy="19" r="7"   opacity="0.5"/>
            <circle cx="32" cy="32" r="13"/>
          </svg>
        </span>
        <span class="name">Pushkar Ball</span>
      </a>
    </div>
  </div>

  <!-- Shown automatically by CSS whenever the phone is held upright, same as
       every game inside — the hub is landscape-only too. -->
  <div id="rotate-screen">
    <div class="phone"></div>
    <p>&#8635;</p>
  </div>

  <script type="module" src="js/hub.js"></script>
</body>
</html>
